schema_version: "1.1"
name: feature-work-asks-about-minor
description: Bump-fit case. The only change since v1.2.3 adds a --json flag, which is a minor, so /patch should say so and ask once.
expected_outcome: |
  The agent sees that the work since v1.2.3 adds a feature users couldn't use before (--json), says
  it fits a minor release (1.3.0) rather than a patch, and asks once which to ship. It creates no
  release commit or tag and pushes nothing while it waits for the answer.
context:
  scaffold_script: place-files.sh
