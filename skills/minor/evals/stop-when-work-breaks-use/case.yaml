schema_version: "1.1"
name: stop-when-work-breaks-use
description: Bump-fit stop case. The only change since v0.4.2 renames the --sort flag to --order, which breaks existing scripts, so it's a major and /minor must stop and ask.
expected_outcome: |
  The agent sees that renaming --sort to --order breaks existing use, says the work fits a major
  release (1.0.0, or whatever the user chooses for a 0.x project) rather than a minor, and stops to
  ask. It creates no release commit or tag and pushes nothing.
context:
  scaffold_script: place-files.sh
