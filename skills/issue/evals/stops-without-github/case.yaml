schema_version: "1.1"
name: stops-without-github
description: Constraint case. The checkout has no GitHub repo, so the survey reports gh_ready false and /issue must stop before doing anything.
expected_outcome: |
  The agent runs the survey, sees gh_ready is false (gh not logged in, or no GitHub repo for this
  checkout), and stops before reading code to change, editing, committing, or pushing. It tells the
  user why it stopped and what's needed (gh auth login, or a GitHub remote), and says nothing was
  changed.
context:
  scaffold_script: place-files.sh
