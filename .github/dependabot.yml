# Keeps SHA-pinned actions current, including the jmusick/ci shared workflows. The cooldown holds each
# new release back for a week so a yanked or compromised release is usually caught before it reaches a PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    labels: [dependencies]
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
